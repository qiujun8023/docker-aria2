name: Docker Publish

on:
  schedule:
    # Check daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual runs
    inputs:
      force:
        description: Build even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for updates
        id: check
        run: |
          # Fingerprint every installed package version, so an update to aria2 or any dependency (openssl etc.) triggers a build
          docker run --rm alpine:latest sh -c \
            'apk add -q --no-cache aria2 >/dev/null && apk info -v 2>/dev/null | sort' > PACKAGES.new
          VERSION=$(docker run --rm alpine:latest sh -c \
            'apk add -q --no-cache aria2 >/dev/null && aria2c -v' | sed -n 's/^aria2 version //p')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.force }}" != "true" ] && cmp -s PACKAGES PACKAGES.new; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date: ${VERSION}"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Packages changed, building ${VERSION}"
            diff PACKAGES PACKAGES.new || true
          fi

      - name: Set up QEMU
        if: steps.check.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aria2:${{ steps.check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aria2:latest

      - name: Commit
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv PACKAGES.new PACKAGES
          git add PACKAGES
          # A forced build may leave PACKAGES unchanged
          git diff --cached --quiet && exit 0
          git commit -m "chore: update aria2 ${VERSION} packages"
          git push origin HEAD:master
